<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B0C10">
  <title>Nebula Party · Mando</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="mando" data-pantalla="unirse">
  <main id="mando">
    <!-- 1. Unirse -->
    <section id="pantalla-unirse" class="panel panel-unirse activo" aria-labelledby="titulo-mando">
      <h1 id="titulo-mando" class="titulo-mando">NEBULA PARTY</h1>
      <label class="campo">CÓDIGO DE SALA
        <input id="codigo" type="text" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD">
      </label>
      <label class="campo">TU NOMBRE
        <input id="nombre" type="text" maxlength="10" autocomplete="nickname" spellcheck="false" placeholder="SANTI">
      </label>
      <button id="btn-unirse" class="btn-ui" type="button">UNIRSE</button>
      <p id="aviso" class="aviso" aria-live="polite"></p>
    </section>

    <!-- 2. Espera (título y lobby) -->
    <section id="pantalla-espera" class="panel panel-centro" aria-live="polite">
      <div class="selector">
        <button class="btn-flecha" type="button" data-dir="izq" aria-label="Personaje anterior">◄</button>
        <canvas id="ficha" class="ficha" width="32" height="32" role="img" aria-label="Tu personaje"></canvas>
        <button class="btn-flecha" type="button" data-dir="der" aria-label="Personaje siguiente">►</button>
      </div>
      <p id="txt-personaje" class="txt-grande"></p>
      <p id="txt-espera" class="txt"></p>
      <button id="btn-listo" class="btn-ui" type="button" data-btn="A" hidden>¡LO QUIERO!</button>
    </section>

    <!-- 3. Tablero -->
    <section id="pantalla-tablero" class="panel panel-centro">
      <p id="txt-turno" class="txt-grande" aria-live="polite"></p>
      <p id="txt-opcion" class="txt"></p>
      <div class="fila-turno">
        <button class="btn-flecha flecha-turno" type="button" data-dir="izq" aria-label="Opción anterior">◄</button>
        <button id="btn-dado" class="btn-dado" type="button" data-btn="A" disabled>LANZAR DADO</button>
        <button id="btn-b" class="btn-ui btn-secundario" type="button" data-btn="B" hidden>OBJETOS</button>
        <button class="btn-flecha flecha-turno" type="button" data-dir="der" aria-label="Opción siguiente">►</button>
      </div>
    </section>

    <!-- 4. Minijuego: D-Pad a la izquierda, A y B a la derecha -->
    <section id="pantalla-minijuego" class="panel panel-juego">
      <div class="dpad" role="group" aria-label="Cruceta de dirección">
        <button class="dpad-btn d-arriba" type="button" data-dir="arriba" aria-label="Arriba"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l8 10H4z"/></svg></button>
        <button class="dpad-btn d-izq" type="button" data-dir="izq" aria-label="Izquierda"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l10-8v16z"/></svg></button>
        <span class="dpad-centro" aria-hidden="true"></span>
        <button class="dpad-btn d-der" type="button" data-dir="der" aria-label="Derecha"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12L10 4v16z"/></svg></button>
        <button class="dpad-btn d-abajo" type="button" data-dir="abajo" aria-label="Abajo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20l8-10H4z"/></svg></button>
      </div>
      <p id="txt-mini" class="txt estado-mini" aria-live="polite">¡ESQUIVA!</p>
      <div class="acciones" role="group" aria-label="Botones de acción">
        <button class="btn-accion btn-b" type="button" data-btn="B" aria-label="Botón B: precisión">B</button>
        <button class="btn-accion btn-a" type="button" data-btn="A" aria-label="Botón A: impulso">A</button>
      </div>
    </section>

    <!-- 5. Podio -->
    <section id="pantalla-podio" class="panel panel-centro">
      <p id="txt-podio" class="txt-grande" aria-live="polite"></p>
      <p id="txt-podio-sub" class="txt"></p>
    </section>
  </main>

  <p id="info-yo" class="info-yo"></p>
  <div id="pausa" class="pausa" hidden aria-live="polite">JUEGO EN PAUSA</div>
  <div id="emotes" class="emotes" role="group" aria-label="Emotes">
    <button type="button" data-emote="0" aria-label="Risa">😄</button>
    <button type="button" data-emote="1" aria-label="Corazón">❤️</button>
    <button type="button" data-emote="2" aria-label="Enojo">😠</button>
    <button type="button" data-emote="3" aria-label="Aplauso">👏</button>
  </div>
  <button id="btn-pantalla" class="btn-pantalla" type="button" aria-label="Pantalla completa">⛶</button>

  <script src="js/config.js"></script>
  <!-- Socket.io: en tu PC lo da server.js; en GitHub Pages se baja de internet -->
  <script>document.write('<script src="' + (window.NEBULA_SERVIDOR ? 'https://cdn.jsdelivr.net/npm/socket.io-client@4.8.1/dist/socket.io.min.js' : '/socket.io/socket.io.js') + '"><\/script>');</script>
  <script src="js/Sprites.js"></script>
  <script src="js/controller/MobileInputs.js"></script>
</body>
</html>
